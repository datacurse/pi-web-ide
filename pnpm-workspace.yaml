# pnpm 12 requires every package with a build script to be explicitly
# classified. esbuild and tailwind's oxide need their postinstall to link
# platform binaries; node-pty's picks the right prebuilt binding for this
# platform and ABI and installs its spawn-helper — without it there is no
# terminal at all.
allowBuilds:
  '@homebridge/node-pty-prebuilt-multiarch': true
  '@tailwindcss/oxide': true
  esbuild: true
