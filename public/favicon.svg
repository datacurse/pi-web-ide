	<!--
	  Brain, orange. Transparent background on purpose: the same file has to sit
	  on a light and a dark browser chrome, and the fill/fold pair is contrasty
	  enough for both.

	  The silhouette is one path of nine outward arcs around an ellipse (the
	  lobes). The folds are deliberately few and heavy — at the 16px a tab
	  actually renders, anything finer collapses into a smudge.
	-->
