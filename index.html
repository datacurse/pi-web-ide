<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>pwi</title>
    <!--
		  Pick the theme before the first paint. The app would set the same
		  attribute on mount, but the module graph loads first — long enough to
		  flash a dark window at someone who chose the light flavor.

		  Deliberately not validating the stored value: an unrecognised one
		  matches no palette and falls through to the default on :root, and
		  prefs.ts normalises it on mount. Listing the flavors here too would
		  just be a second place to forget one.
		-->
    <script>
      try {
        // Throws outright in some privacy modes; the default palette on
        // :root covers that.
        document.documentElement.dataset.theme =
          localStorage.getItem("pwi:theme") || "mocha";
        if (localStorage.getItem("pwi:hideScrollbars") === "1")
          document.documentElement.dataset.scrollbars = "hidden";
        // The variables applyTheme last wrote: a VS Code theme's palette,
        // the syntax colors, and whether it is light.
        var boot = JSON.parse(localStorage.getItem("pwi:themeBoot") || "{}");
        if (boot.style) document.documentElement.style.cssText = boot.style;
        if (boot.light) document.documentElement.dataset.light = "";
      } catch {}
    </script>
    <!--
		  index.css arrives with the JS bundle, so until then the page would be
		  white. Paint each theme's backdrop (--ct-mantle) now; keep in sync.
		  A VS Code theme's comes from the inline variables set above.
		-->
    <style>
      html {
        background: var(--ct-mantle, #181825);
        color-scheme: dark;
      }
      html[data-light] {
        color-scheme: light;
      }
      html[data-theme="macchiato"] {
        background: #1e2030;
      }
      html[data-theme="frappe"] {
        background: #292c3c;
      }
      html[data-theme="claude"] {
        background: #141414;
      }
      html[data-theme="latte"] {
        background: #e6e9ef;
        color-scheme: light;
      }
      html[data-theme="claude-light"] {
        background: #f0eee6;
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
